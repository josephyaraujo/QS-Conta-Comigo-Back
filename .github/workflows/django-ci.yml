name: Django CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Instalar Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar projeto Django
        run: python manage.py check

      - name: Executar migrations
        run: python manage.py migrate

      - name: Gerar diagrama de classes UML
        run: |
          mkdir -p docs
          python manage.py graph_models api --pydot -g -o docs/diagrama-classes-dominio.png

      - name: Publicar diagrama UML como artefato
        uses: actions/upload-artifact@v7
        with:
          name: diagrama-classes-dominio
          path: docs/diagrama-classes-dominio.png
          if-no-files-found: error
          retention-days: 30

      - name: Executar testes
        run: python manage.py test

      - name: Detectar código depreciado
        run: pytest -W error::DeprecationWarning -W error::PendingDeprecationWarning

      - name: Verificar código com Ruff
        run: python -m ruff check api conta_comigo_backend --select UP

      - name: Verificar padrão de formatação com Ruff
        run: python -m ruff format --check api conta_comigo_backend

      - name: Detectar código duplicado
        run: python -m pylint api conta_comigo_backend