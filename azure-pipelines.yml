trigger:
- main

resources:
- repo: self

variables:
  # Nome da conexão criada no passo 1
  dockerRegistryServiceConnection: 'docker_hub' 
  imageRepository: 'josephyaraujo/cc-backend' 
  containerRegistry: 'docker.io' 
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile.prod'
  tag: '$(Build.BuildId)'

# Esse pool padrão serve para o Build (máquina temporária do Azure)
pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and Push Stage
  jobs:
  - job: Build
    displayName: Build
    steps:
    # 1. FAZER LOGIN E BUILD/PUSH
    - task: Docker@2
      displayName: Build and push image to Docker Hub
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

# --- NOVO STAGE DE DEPLOY PARA A VM ---
- stage: Deploy
  displayName: Deploy to VM
  dependsOn: Build
  jobs:
  - deployment: DeployBackend
    displayName: Deploy Backend
    environment:
      name: 'prod' 
      resourceType: VirtualMachine
    strategy:
      runOnce:
        deploy:
          steps:
          # 2. LOGIN NO DOCKER DENTRO DA VM (Necessário se o repositório for privado)
          - task: Docker@2
            displayName: Login to Docker Hub na VM
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          # 3. PARAR O ANTIGO, FAZER PULL E RODAR O NOVO
          - script: |
              echo "1. Parando a versão antiga..."
              sudo docker stop cc-backend-container || true
              sudo docker rm cc-backend-container || true

              echo "2. Baixando a imagem mais recente..."
              sudo docker pull $(containerRegistry)/$(imageRepository):latest

              echo "3. Subindo o novo container com as variáveis injetadas..."
              sudo docker run -d \
                --name cc-backend-container \
                --network cc-network \
                -p 8000:8000 \
                -e ALLOWED_HOSTS="$(ALLOWED_HOSTS)" \
                -e POSTGRES_DB="$(POSTGRES_DB)" \
                -e POSTGRES_USER="$(POSTGRES_USER)" \
                -e POSTGRES_PASSWORD="$(POSTGRES_PASSWORD)" \
                -e POSTGRES_HOST="$(POSTGRES_HOST)" \
                -e POSTGRES_PORT="$(POSTGRES_PORT)" \
                -e SOCIAL_AUTH_SUAP_KEY="$(SOCIAL_AUTH_SUAP_KEY)" \
                -e SOCIAL_AUTH_SUAP_SECRET="$(SOCIAL_AUTH_SUAP_SECRET)" \
                -e SOCIAL_AUTH_SUAP_REDIRECT_URI="$(SOCIAL_AUTH_SUAP_REDIRECT_URI)" \
                $(containerRegistry)/$(imageRepository):latest
            displayName: 'Atualizar e Rodar Container na VM'